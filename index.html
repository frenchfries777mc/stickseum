  document.getElementById('footVer').textContent=t('foot_v',{v:latest.version,d:d.updated||latest.date});
  const ti=v=>esc(tv(v.version,'title',v.title)),su=v=>esc(tv(v.version,'summary',v.summary));
  document.getElementById('latestBox').innerHTML='<div class="latest"><span class="tag">'+t('v_latest')+'</span><div class="ver">v'+esc(latest.version)+'<small>'+esc(latest.date)+' · '+mb(latest.size)+'</small></div><div class="sum"><b>'+ti(latest)+'</b> — '+su(latest)+'</div><div class="cta" style="margin-top:0"><a class="btn play" href="'+esc(latest.file)+'">'+t('v_play')+'</a><a class="btn dl" href="'+esc(latest.file)+'" download="'+esc(latest.file.split('/').pop())+'">'+dlSvg+' '+t('b_dl')+'</a></div></div>';
  document.getElementById('historyBox').innerHTML=rest.length?rest.map(v=>'<div class="vrow"><div><div class="v">v'+esc(v.version)+'</div><div class="d">'+esc(v.date)+' · '+mb(v.size)+'</div></div><div><div class="t">'+ti(v)+'</div><div class="s">'+su(v)+'</div></div><div><a class="try" href="'+esc(v.file)+'">'+t('v_play')+'</a><a class="get" href="'+esc(v.file)+'" download="'+esc(v.file.split('/').pop())+'">'+dlSvg+'</a></div></div>').join(''):'<div style="color:var(--muted)">'+t('v_nopast')+'</div>';
}
const NOTES_SHOWN=5;
function renderNotes(d){
  NDATA=d;
  const list=(d&&Array.isArray(d.notes))?d.notes:[],box=document.getElementById('notesBox'),more=document.getElementById('notesMore');
  if(!list.length){box.innerHTML='<div style="color:var(--muted)">'+t('n_none')+'</div>';more.style.display='none';return;}
  const all=box.dataset.all==='1',shown=all?list:list.slice(0,NOTES_SHOWN);
  box.innerHTML=shown.map(n=>{const k=String(n.build||'').replace(/^v/,''),e=I.N[k],tr=e&&e.title&&e.title[LANG];
    const items=(n.items||[]).map((x,ix)=>{const it=e&&e.items&&e.items[ix];return (it&&it[LANG])||x;});
    return '<div class="note"><div class="nh"><span class="nt">'+esc(tr||(e&&e.title&&e.title.ko)||n.title)+'</span><span class="nd">'+esc(n.date)+(n.build?' · '+esc(n.build):'')+'</span></div><ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>';}).join('');
  more.style.display=(!all&&list.length>NOTES_SHOWN)?'':'none';
  more.onclick=()=>{box.dataset.all='1';renderNotes(d);};
}
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=t(e.dataset.i);});
  document.title=t('title');
  const m=document.querySelector('meta[name=description]');if(m)m.content=t('desc');
  const og=document.querySelector('meta[property="og:description"]');if(og)og.content=t('desc');
  const sel=document.getElementById('langSel');sel.value=LANG;
  render(DATA);renderNotes(NDATA);
}
(function(){const sel=document.getElementById('langSel');
  sel.innerHTML=I.L.map(l=>'<option value="'+l+'">'+NAMES[l]+'</option>').join('');
  sel.onchange=()=>{LANG=sel.value;try{localStorage.setItem('ce_lang',LANG);}catch(e){}applyLang();};
})();
applyLang();
fetch('patchnotes.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(renderNotes).catch(()=>{});
fetch('versions.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>{});
</script>
